name: Build & Release

# Full frozen builds: on version tags (which also publish a release) and on
# demand. Every build runs the frozen app's --self-test on its own OS.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Portable llama.cpp: compile for a baseline CPU (AVX2/FMA/F16C on x86-64),
  # not for the CI runner's CPU, or the app crashes on older user machines.
  CMAKE_ARGS: '-DGGML_NATIVE=OFF'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact: mdmt-linux-x86_64
          - os: macos-15
            name: macos
            artifact: mdmt-macos-arm64
          - os: windows-latest
            name: windows
            artifact: mdmt-windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*-${{ matrix.name }}.txt

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd cmake build-essential
          # Runtime libraries of PySide6's xcb platform plugin and Qt Multimedia.
          # Present here, PyInstaller bundles them; users often lack them
          # ("could not load the Qt platform plugin xcb").
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0 libpulse0

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract cmake pkgconf

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y

      - name: Report UPX availability (specs set upx=False)
        run: |
          command -v upx && upx --version | head -1 || echo "upx is not installed"

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/lock-${{ matrix.name }}.txt
          pip install -r requirements/dev-${{ matrix.name }}.txt

      # ---- PyAV against an LGPL-only FFmpeg ---------------------------------
      # PyPI's PyAV wheels bundle FFmpeg linked with GPL libx264/libx265.
      # Releases instead use a decoder-only FFmpeg built from source with
      # native (LGPL) code only, and PyAV compiled against it.

      - name: Cache LGPL FFmpeg and PyAV wheel
        id: av-cache
        uses: actions/cache@v4
        with:
          path: |
            ffmpeg-lgpl
            av-wheel
          key: av-lgpl-${{ matrix.name }}-py312-${{ hashFiles('packaging/build_ffmpeg_lgpl.sh', format('requirements/lock-{0}.txt', matrix.name)) }}

      - name: Build LGPL FFmpeg and PyAV (Linux/macOS)
        if: runner.os != 'Windows' && steps.av-cache.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        run: |
          packaging/build_ffmpeg_lgpl.sh "$PWD/ffmpeg-lgpl"
          AV=$(grep -oE '^av==[^ ]+' requirements/lock-${{ matrix.name }}.txt)
          PKG_CONFIG_PATH="$PWD/ffmpeg-lgpl/lib/pkgconfig" LDFLAGS="-Wl,-rpath,$PWD/ffmpeg-lgpl/lib" \
            pip wheel --no-binary av --no-deps "$AV" -w av-wheel

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows' && steps.av-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils xz

      - name: Build LGPL FFmpeg (Windows, MSVC toolchain)
        if: runner.os == 'Windows' && steps.av-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          # MSYS2's coreutils link.exe would shadow MSVC's linker.
          mv /usr/bin/link /usr/bin/link.msys
          packaging/build_ffmpeg_lgpl.sh "$(cygpath -u "$GITHUB_WORKSPACE")/ffmpeg-lgpl"

      - name: Build PyAV against it (Windows)
        if: runner.os == 'Windows' && steps.av-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ff = Join-Path $PWD 'ffmpeg-lgpl'
          $env:INCLUDE = "$ff\include;$env:INCLUDE"
          # FFmpeg's MSVC build installs its import libraries (avformat.lib, ...)
          # next to the DLLs in bin\, not in lib\.
          $env:LIB = "$ff\bin;$ff\lib;$env:LIB"
          $av = (Select-String -Path requirements/lock-windows.txt -Pattern '^av==\S+').Matches[0].Value
          pip wheel --no-binary av --no-deps $av -w av-raw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Bundle the FFmpeg DLLs into the wheel (as PyPI's wheels do).
          delvewheel repair --add-path "$ff\bin" -w av-wheel (Get-ChildItem av-raw\av-*.whl).FullName

      - name: Install the LGPL PyAV
        run: |
          pip install --no-deps --force-reinstall av-wheel/av-*.whl
          python -c "import av; m = av._core.library_meta['libavcodec']; print(av.__version__, av.ffmpeg_version_info, m['license']); assert 'x264' not in m['configuration'] and m['license'].startswith('LGPL')"

      - name: Read pinned llama-cpp-python commit
        id: llama
        run: echo "sha=$(grep -oE '@[0-9a-f]{40}' requirements/llama.txt | tr -d @)" >> "$GITHUB_OUTPUT"

      - name: Cache llama-cpp-python wheel
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: llama-cpp-python-${{ matrix.name }}-py312-${{ steps.llama.outputs.sha }}-${{ env.CMAKE_ARGS }}

      - name: Build llama-cpp-python wheel
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: pip wheel --no-deps -r requirements/llama.txt -w wheels

      - name: Install llama-cpp-python
        run: pip install --no-deps wheels/llama_cpp_python-*.whl

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm mdmt-${{ matrix.name }}.spec

      # ---- verify the bundle ---------------------------------------------

      - name: Check bundled library dependencies (Linux)
        if: runner.os == 'Linux'
        run: python packaging/check_bundle_libs.py dist/mdmt

      - name: Check bundled library dependencies and signature (macOS)
        if: runner.os == 'macOS'
        run: |
          python packaging/check_bundle_libs.py dist/MDMT.app
          # arm64 code must carry at least an ad-hoc signature (not a
          # distribution signature: the builds are intentionally unsigned).
          codesign --verify --deep --strict --verbose=2 dist/MDMT.app

      - name: Self-test (Linux, windowed executable)
        if: runner.os == 'Linux'
        run: dist/mdmt/mdmt --self-test --self-test-out "$PWD/selftest-${{ matrix.name }}.json"

      - name: Self-test (macOS, inside MDMT.app)
        if: runner.os == 'macOS'
        run: dist/MDMT.app/Contents/MacOS/mdmt --self-test --self-test-out "$PWD/selftest-${{ matrix.name }}.json"

      # Launched through WMI, detached from this job like a double-click in
      # Explorer, so it starts with no stdout/stderr: the case where v2.0.7
      # crashed in tqdm. This first run also downloads the Whisper model, and
      # the report must show that both streams were missing (and handled).
      - name: Self-test (Windows, detached like an Explorer launch)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist\mdmt\mdmt.exe').Path
          $report = Join-Path $PWD 'selftest-windows-detached.json'
          $cmd = "`"$exe`" --self-test --self-test-out `"$report`""
          $r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create `
                 -Arguments @{ CommandLine = $cmd; CurrentDirectory = $PWD.Path }
          if ($r.ReturnValue -ne 0) { throw "Win32_Process.Create failed: $($r.ReturnValue)" }
          Wait-Process -Id $r.ProcessId -Timeout 1800
          if (Test-Path "$report.log") { Get-Content "$report.log" -Tail 25 }
          python packaging/check_selftest_report.py $report --expect-missing-stdio

      - name: Self-test (Windows, windowed executable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'selftest-windows.json'
          $p = Start-Process -FilePath 'dist\mdmt\mdmt.exe' `
                 -ArgumentList '--self-test', '--self-test-out', "`"$report`"" `
                 -Wait -PassThru
          Write-Host "mdmt.exe exited with $($p.ExitCode)"
          if (Test-Path "$report.log") { Get-Content "$report.log" -Tail 40 }
          exit $p.ExitCode

      - name: Upload self-test report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.name }}
          path: |
            selftest-${{ matrix.name }}*.json
            selftest-${{ matrix.name }}*.json.log
          if-no-files-found: warn

      # ---- package ---------------------------------------------------------

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r -y -q ../${{ matrix.artifact }}.zip mdmt/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the bundle's symlinks; `zip -r` would dereference them,
        # bloating the archive and breaking the code signature.
        run: ditto -c -k --keepParent dist/MDMT.app ${{ matrix.artifact }}.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/mdmt -DestinationPath ${{ matrix.artifact }}.zip

      - name: Report bundle size
        run: |
          du -sh dist/* || true
          ls -l ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mdmt-linux-x86_64/mdmt-linux-x86_64.zip
            mdmt-macos-arm64/mdmt-macos-arm64.zip
            mdmt-windows-x64/mdmt-windows-x64.zip
          body: |
            Also available at [jamescaldwell.net/software.html](https://jamescaldwell.net/software.html).

            **Unsigned builds.** MDMT is an independent open-source project without paid code-signing certificates, so these apps are not signed or notarized; the source code and the CI build logs that produced these files are public. On first launch, macOS needs one approval in System Settings → Privacy & Security → Open Anyway (or run `xattr -dr com.apple.quarantine /path/to/MDMT.app`), and Windows SmartScreen needs "More info" → "Run anyway". The macOS build requires Apple Silicon and macOS 15 or newer; the Linux build is x86-64. See the README for details.
          generate_release_notes: true
