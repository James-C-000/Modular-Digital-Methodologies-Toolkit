name: Build & Release

# Full frozen builds: on version tags (which also publish a release) and on
# demand. Every build runs the frozen app's --self-test on its own OS.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Portable llama.cpp: compile for a baseline CPU (AVX2/FMA/F16C on x86-64),
  # not for the CI runner's CPU, or the app crashes on older user machines.
  CMAKE_ARGS: '-DGGML_NATIVE=OFF'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact: mdmt-linux-x86_64
          - os: macos-14
            name: macos
            artifact: mdmt-macos-arm64
          - os: windows-latest
            name: windows
            artifact: mdmt-windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*-${{ matrix.name }}.txt

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd cmake build-essential
          # Runtime libraries of PySide6's xcb platform plugin and Qt Multimedia.
          # Present here, PyInstaller bundles them; users often lack them
          # ("could not load the Qt platform plugin xcb").
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0 libpulse0

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract cmake

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y

      - name: Report UPX availability (specs set upx=False)
        run: |
          command -v upx && upx --version | head -1 || echo "upx is not installed"

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/lock-${{ matrix.name }}.txt
          pip install -r requirements/dev-${{ matrix.name }}.txt

      - name: Read pinned llama-cpp-python commit
        id: llama
        run: echo "sha=$(grep -oE '@[0-9a-f]{40}' requirements/llama.txt | tr -d @)" >> "$GITHUB_OUTPUT"

      - name: Cache llama-cpp-python wheel
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: llama-cpp-python-${{ matrix.name }}-py312-${{ steps.llama.outputs.sha }}-${{ env.CMAKE_ARGS }}

      - name: Build llama-cpp-python wheel
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: pip wheel --no-deps -r requirements/llama.txt -w wheels

      - name: Install llama-cpp-python
        run: pip install --no-deps wheels/llama_cpp_python-*.whl

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm mdmt-${{ matrix.name }}.spec

      # ---- verify the bundle ---------------------------------------------

      - name: Check bundled library dependencies (Linux)
        if: runner.os == 'Linux'
        run: python packaging/check_bundle_libs.py dist/mdmt

      - name: Check bundled library dependencies and signature (macOS)
        if: runner.os == 'macOS'
        run: |
          python packaging/check_bundle_libs.py dist/MDMT.app
          # arm64 code must carry at least an ad-hoc signature (not a
          # distribution signature: the builds are intentionally unsigned).
          codesign --verify --deep --strict --verbose=2 dist/MDMT.app

      - name: Self-test (Linux, windowed executable)
        if: runner.os == 'Linux'
        run: dist/mdmt/mdmt --self-test --self-test-out "$PWD/selftest-${{ matrix.name }}.json"

      - name: Self-test (macOS, inside MDMT.app)
        if: runner.os == 'macOS'
        run: dist/MDMT.app/Contents/MacOS/mdmt --self-test --self-test-out "$PWD/selftest-${{ matrix.name }}.json"

      - name: Self-test (Windows, windowed executable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'selftest-windows.json'
          $p = Start-Process -FilePath 'dist\mdmt\mdmt.exe' `
                 -ArgumentList '--self-test', '--self-test-out', "`"$report`"" `
                 -Wait -PassThru
          Write-Host "mdmt.exe exited with $($p.ExitCode)"
          if (Test-Path "$report.log") { Get-Content "$report.log" -Tail 40 }
          exit $p.ExitCode

      - name: Upload self-test report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.name }}
          path: |
            selftest-${{ matrix.name }}.json
            selftest-${{ matrix.name }}.json.log
          if-no-files-found: warn

      # ---- package ---------------------------------------------------------

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r -y -q ../${{ matrix.artifact }}.zip mdmt/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the bundle's symlinks; `zip -r` would dereference them,
        # bloating the archive and breaking the code signature.
        run: ditto -c -k --keepParent dist/MDMT.app ${{ matrix.artifact }}.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/mdmt -DestinationPath ${{ matrix.artifact }}.zip

      - name: Report bundle size
        run: |
          du -sh dist/* || true
          ls -l ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mdmt-linux-x86_64/mdmt-linux-x86_64.zip
            mdmt-macos-arm64/mdmt-macos-arm64.zip
            mdmt-windows-x64/mdmt-windows-x64.zip
          body: |
            Also available at [jamescaldwell.net/software.html](https://jamescaldwell.net/software.html).

            **Unsigned builds.** MDMT is an independent open-source project without paid code-signing certificates, so these apps are not signed or notarized; the source code and the CI build logs that produced these files are public. On first launch, macOS needs one approval in System Settings → Privacy & Security → Open Anyway (or run `xattr -dr com.apple.quarantine /path/to/MDMT.app`), and Windows SmartScreen needs "More info" → "Run anyway". The macOS build requires Apple Silicon and macOS 14 or newer; the Linux build is x86-64. See the README for details.
          generate_release_notes: true
