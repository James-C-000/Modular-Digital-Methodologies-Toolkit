name: Tests

# Fast checks on every push and pull request: lint + pytest on all three OSes.
# Full frozen builds and self-tests live in build.yml (tags / manual runs).
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-15
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      # Tesseract lets the end-to-end OCR tests run instead of skipping.
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --no-progress -y
          echo "C:\\Program Files\\Tesseract-OCR" >> "$GITHUB_PATH"

      # llama-cpp-python is not needed by most tests (it is only loaded when a
      # model is), so the slow source build is left to the llama-cpp job.
      - name: Python and locked dependencies
        uses: ./.github/actions/python-deps
        with:
          platform: ${{ matrix.name }}

      - name: Lint (ruff)
        run: ruff check .

      - name: Check for banned dependencies
        run: python packaging/check_banned_deps.py

      - name: Run tests
        run: pytest -v

  # The tests that need llama-cpp-python (such as the check that every argument
  # MDMT passes exists in it), against the release build of the pinned version.
  llama-cpp:
    runs-on: ubuntu-latest
    env:
      # Same flags and cache key as build.yml's Linux job, so they share the wheel.
      CMAKE_ARGS: -DGGML_NATIVE=OFF
    steps:
      - uses: actions/checkout@v4

      - name: Python and locked dependencies
        uses: ./.github/actions/python-deps
        with:
          platform: linux

      - name: llama-cpp-python
        uses: ./.github/actions/llama-cpp-python
        with:
          platform: linux

      - name: Run the llama-cpp-python tests
        run: pytest -v -rs tests/test_rag_generation.py

  # A small retrieval regression on the eval corpus (no reranker, no LLM).
  retrieval-eval:
    runs-on: ubuntu-latest
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.appdata
    steps:
      - uses: actions/checkout@v4

      - name: Python and locked dependencies
        uses: ./.github/actions/python-deps
        with:
          platform: linux
          dev: 'false'

      - name: Cache the eval corpus and retrieval model
        uses: actions/cache@v4
        with:
          path: |
            eval/corpus
            .appdata/mdmt/models/rag
          key: retrieval-eval-${{ hashFiles('eval/corpus.json', 'RAG/models.py') }}

      # Embedding the corpus takes ~2 minutes. The index only changes with the
      # corpus, the indexing code (RAG/, and the sentence splitter it chunks
      # with) or the locked libraries (ONNX Runtime, tokenizers), so any change
      # to those rebuilds it and the eval still tests indexing.
      - name: Cache the eval index
        uses: actions/cache@v4
        with:
          path: eval/.index
          key: retrieval-eval-index-${{ hashFiles('eval/corpus.json', 'RAG/*.py', 'NLP/text_utils.py', 'requirements/lock-linux.txt') }}

      - name: Fetch the corpus
        run: python -m eval.fetch_corpus

      - name: Retrieval regression
        run: python -m eval.run_eval --no-rerank --check eval/baseline.json

      - name: Check the questions against the corpus
        run: python -m eval.check_questions > eval/results/check.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: eval/results/
