name: Tests

# Fast checks on every push and pull request: lint + pytest on all three OSes.
# Full frozen builds and self-tests live in build.yml (tags / manual runs).
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-15
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*-${{ matrix.name }}.txt

      # Tesseract lets the end-to-end OCR tests run instead of skipping.
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --no-progress -y
          echo "C:\\Program Files\\Tesseract-OCR" >> "$GITHUB_PATH"

      # llama-cpp-python is not needed by the tests (it is only loaded when a
      # model is), so the slow source build is skipped here.
      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/lock-${{ matrix.name }}.txt
          pip install -r requirements/dev-${{ matrix.name }}.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check for banned dependencies
        run: python packaging/check_banned_deps.py

      - name: Run tests
        run: pytest -v

  # A small retrieval regression on the eval corpus (no reranker, no LLM).
  retrieval-eval:
    runs-on: ubuntu-latest
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.appdata
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/lock-linux.txt

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/lock-linux.txt

      - name: Cache the eval corpus and retrieval model
        uses: actions/cache@v4
        with:
          path: |
            eval/corpus
            .appdata/mdmt/models/rag
          key: retrieval-eval-${{ hashFiles('eval/corpus.json', 'RAG/models.py') }}

      - name: Fetch the corpus
        run: python -m eval.fetch_corpus

      - name: Retrieval regression
        run: python -m eval.run_eval --no-rerank --check eval/baseline.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: eval/results/
