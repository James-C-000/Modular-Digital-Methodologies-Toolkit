name: Retrieval runtime benchmark

# Dev-only: runs tests/dev/bench_retrieval_runtimes.py on each CI platform when
# the script changes, for the Phase 3 RAG design. Not part of the release.
on:
  push:
    branches: ['polish/**']
    paths: ['tests/dev/bench_retrieval_runtimes.py', '.github/workflows/bench.yml']

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux}
          - {os: macos-15, name: macos}
          - {os: windows-latest, name: windows, cmake_extra: '-DGGML_OPENMP=OFF'}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_ARGS: -DGGML_NATIVE=OFF ${{ matrix.cmake_extra }}
      # The benchmark uses the JamePeng fork's LlamaEmbedding (not in mainline),
      # so it keeps the fork commit it was written for.
      BENCH_LLAMA_SHA: fe38cbfac424973ccd9cfaa199a64a02502af4d1
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*-${{ matrix.name }}.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/lock-${{ matrix.name }}.txt
      - name: Restore the fork's llama-cpp-python wheel
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: llama-cpp-python-${{ matrix.name }}-py312-${{ env.BENCH_LLAMA_SHA }}-${{ env.CMAKE_ARGS }}
      - name: Build the fork's llama-cpp-python wheel
        if: steps.llama-cache.outputs.cache-hit != 'true'
        # --no-cache-dir: pip's wheel cache ignores CMAKE_ARGS (see build.yml).
        run: pip wheel --no-deps --no-cache-dir -w wheels "llama-cpp-python @ git+https://github.com/JamePeng/llama-cpp-python.git@${BENCH_LLAMA_SHA}"
      - run: pip install --no-deps wheels/llama_cpp_python-*.whl
      - name: CPU info
        run: python -c "import os, platform; print(platform.platform(), platform.processor(), os.cpu_count())"
      - name: Benchmark (4 threads)
        run: python tests/dev/bench_retrieval_runtimes.py --threads 4 --out bench-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.name }}
          path: bench-${{ matrix.name }}.json
